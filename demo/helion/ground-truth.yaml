# Golden facts. `anchor` is the regex the validator looks for in the NAMED
# transcript, inside the NAMED speaker's lines only.
golden_facts:
  - {id: GF-01A, arc: 1, meeting: sales-04,  speaker: reuter, anchor: 'October 15|fifteenth of October|October the fifteenth',
     note: "Reuter promises Titan a launch date for the reporting module. Canonical line: «I told him — October 15.»"}
  - {id: GF-01B, arc: 1, meeting: sync-03,  speaker: sokol, anchor: 'December',
     note: "engineering plans the same module for the December release. Say the month by name, never «Q4»"}
  - {id: GF-01C, arc: 1, meeting: sales-04,  speaker: kim, anchor: 'campaign',
     note: "marketing builds the campaign around October"}
  - {id: GF-02,  arc: 2, meeting: leadership-06,   speaker: guryev, anchor: 'four point four|4\.4',
     note: "Q1 revenue from memory — «four point four»; the finance sheet says 3,820,000"}
  - {id: GF-03A, arc: 3, meeting: leadership-02,   speaker: akhmetov, anchor: 'six hundred K|\$?600K|six hundred thousand',
     note: "Pulse 2.0 budget, version 1, March 10"}
  - {id: GF-04A, arc: 4, meeting: sync-03,  speaker: tsarev, anchor: '\bAPI\b',
     note: "first of three mentions of the Titan core-banking integration risk"}
  - {id: GF-07A, arc: 7, meeting: leadership-02,   speaker: lebedev, anchor: 'data mart',
     note: "the junior answers the data-mart question instead of the leads"}
  - {id: GF-07B, arc: 7, meeting: sync-03,  speaker: lebedev, anchor: 'data mart'}
  - {id: GF-07C, arc: 7, meeting: delivery-02, speaker: lebedev, anchor: 'data mart'}
  - {id: GF-08,  arc: 8, meeting: delivery-02, speaker: melnik, anchor: 'billing',
     note: "the key scene: Melnik explains how Sentinel's billing works, a month before he leaves"}
  - {id: GF-09A, arc: 9, meeting: sales-04,  speaker: frolov,  anchor: '15 ?%|fifteen per ?cent|15 per ?cent',
