# Dossier for the simulation (ch. 5): not text anchors but a summary used to
# check that the simulation really leans on HIS words and not on an averaged
# "demanding client". Every trait carries its source.
simulation_dossier:
  client: titan
  persona: Sergey Volkov, SVP Data and Analytics — the business owner of the reporting module, not a procurement gatekeeper
  traits:
    - {trait: "pushes on dates", source: "client-titan-1 (Mar 9), client-titan-6 (Jun 11)"}
    - {trait: "negotiates by phase", source: "client-titan-4 (Apr 24) — three milestones, each with its own payment"}
    - {trait: "wants the SLA in writing", source: "client-titan-2 (Mar 23), client-titan-4 (Apr 24) — penalty clauses"}
  real_objections:
    - "the module misses this year's budget without a date before the May committee (client-titan-2)"
    - "the competitor Analytics Plus is promising three months instead of seven (client-titan-5)"
    - "three internal approvals on their own side are holding up API access, independently of Helion (client-titan-3, client-titan-6)"
  not_hostile: "three years of history, no complaints about the current product; he proposes fair symmetry on dates himself (client-titan-4)"
  note: "the arc 14 test — «Run the reporting-module offer past Volkov» — is live by design: what is being checked is whether the simulation uses these sources rather than the corpus text"

# Client calls must not "know" internal company facts — a direct check of the
# same access boundary the product sells as a feature (ch. 14). The patterns
# are already-validated anchors from internal meetings, reused on purpose: if
# they leaked into a client call, that is the same fact, simply somewhere it
# is not allowed to be.
client_boundary:
  - id: CB-01
    meetings: [client-titan-1, client-titan-2, client-titan-3, client-titan-4,
               client-titan-5, client-titan-6, client-northern-1]
    forbidden:
      - {pattern: 'account executives?', from: LF-05, note: "the decision to hire account executives is internal. The pattern is deliberately narrow, see the note on LF-05"}
      - {pattern: 'gone quiet lately', from: GF-06D, note: "the observation about Sokol's state is internal"}
      - {pattern: 'six million|\$?6M\b', from: GF-10A, note: "size of the round — board classification"}
      - {pattern: '\b190K?\b|one-ninety', from: GF-10B, note: "engineering-lead salary band — board classification"}
      - {pattern: '1\.05|million-oh-five', from: GF-03C, note: "the final v3 budget — an internal figure"}

# Facts that must be said in EXACTLY ONE named meeting and appear nowhere
# else in the loaded corpus. Shows "decided and forgotten" as a fact of the
# corpus rather than as a claim in the text.
lonely_facts:
  - {id: LF-05, arc: 5, meeting: leadership-07, pattern: 'account executives?',
     note: "the decision to hire two ACCOUNT EXECUTIVES must not surface in any OTHER meeting. The pattern is deliberately narrow: broad forms of «hire» would also catch unrelated hiring talk (leadership-06, «Do we hire?» about internal delivery capacity — a legitimate different topic, not a violation). Everywhere outside leadership-07 the corpus says «sales rep», «salesperson» or «someone in sales» — never «account executive»"}

# Structural answers for the graph channel — not text anchors but facts of
# relation. The basis for each name is stated explicitly so there is no
# argument about where it came from.
graph_answers:
  - id: GA-11
    arc: 11
    question: "Who has worked with both Titan and Foodline?"
    answer:
      - {person: frolov,   basis: "direct speech: reports on Titan AND on Foodline in the same meeting, sales-04 and sales-06"}
      - {person: vatulin,  basis: "delegates Foodline (delivery-02/03) plus an explicit self-declaration about taking on Titan (delivery-03, 02:37)"}
      - {person: akhmetov, basis: "product owner for Titan (sync-03/04) plus an explicit link between Foodline and the charting migration (sync-04, 02:49)"}
    note: "three people, three different bases — a test that the system does not confuse `was in the room` with `worked with the client`"

# Strings that must appear NOWHERE in the whole corpus.
negative_controls:
  - {id: NC-12,  arc: 12, pattern: 'churn|cohort',
     note: "arc 12: the honest «I don't know». The topic is never discussed. HARDEST TRAP IN THE ENGLISH CORPUS: an English SaaS transcript produces both words by reflex. Say «customers leaving», «renewals», «accounts we lost», «the March intake» instead — and never the two words themselves"}
  - {id: NC-13A, arc: 13, pattern: 'Demidov|Демидов',
     note: "arc 13: the signatory on the Northern House side is never named anywhere → a red field in the proposal"}
  - {id: NC-13B, arc: 13, pattern: 'delivery date',
     note: "arc 13: the delivery date is never fixed anywhere → the second red field. Allowed alternatives: «launch», «go-live», «when it goes live», «timeline» — never this exact phrase"}

# Pairs that must not meet inside ONE transcript.
forbidden_cooccurrence:
  - {id: FC-01, arc: 1, a: 'October 15|fifteenth of October|October the fifteenth', b: 'December',
     note: "the two dates for the same module never sound together — otherwise there is no misalignment. In practice: October 15 lives in sales-04, leadership-06, client-titan-2, client-titan-4; December lives in leadership-02, sync-03, delivery-02, sync-04, sync-05. Elsewhere say «mid-October» or «the fourth quarter», which match neither side"}

