# ─────────────────────────────────────────────────────────────
# Figures that are SPOKEN somewhere in the corpus but have no row of their own
# in finance_monthly or in the CRM export. Committed here so that no figure a
# reader can hear is left unsourced, and so that the STATUS of each one — sheet
# fact, honest guess, or arithmetic over the CRM — is explicit rather than
# implied. These are background, not load-bearing: no acceptance question is
# answered from them.
background_figures:
  q1_2025_revenue:
    value: 3_415_000
    note: "spoken as «about three point four» — the year-ago comparison; Jan and Feb 2025 sit before finance_monthly starts, so this is committed here rather than derived from the sheet"
  helin_fy2026_forecast:
    value: 19_000_000
    note: "CEO optimism said on the record in board-01 — deliberately has NO sheet behind it; the gap against finance_monthly is a planted fact, not a drift to be fixed"
  open_pipeline_2026_04_07:
    value: 2_292_500
    note: "arithmetic over the CRM: every deal not yet closed on 2026-04-07 — the 11 still-open deals plus D-005, D-017, D-018 and D-020, which closed later; ties to data/crm_deals.csv exactly"
  lebedev_february_count:
    value: 412
    note: "Lebedev's own hand count of the February reconciliations — the hidden-expert arc; a number she carries in her head, with no system behind it (not money, not multiplied)"
  titan_at_risk_2026_03_24:
    value: 530_000
    note: "arithmetic over the CRM: D-002 reporting module (320,000) + D-003 core banking integration (210,000) — the pair Reuter and Frolov add up in sales-04 when the May committee comes up, spoken as «five thirty». No row of its own because it is a sum, but both components are CRM rows; it is the at-risk total, NOT a booking"
  marketing_booth_cost:
    value: 28_000
    note: "the trade-show booth Kim prices in the sales-04 aside, spoken as «twenty-eight K» — a marketing cost, not a deal: no CRM row, and no line of its own in finance_monthly (it sits inside the monthly costs total). Deliberately not 40,000 so it cannot be mis-joined to D-019, CareGrid Health's support contract"
  retail_metrics_price_gap_pct:
    value: 20
    note: "Reuter's read of the competitor's list price on the Foodline deal in sales-04 — «about twenty percent under us», the benchmark the 15 % discount (D-004.discount_pct) was measured against, which is what makes her «five points» arithmetic: 20 − 15. A sales-side estimate with no sheet behind it; a percentage, not money, and unrelated to the compensation gap Guryev quotes in board-01"
  engineering_comp_market_gap_pct:
    value: 20
    note: "Guryev's read of how far Helion's top engineering band sits under the market, spoken in board-01 as «about twenty percent behind the market» — the benchmark that justifies raising the lead ceiling from 160,000 to 190,000 a year [GF-10B]. A compensation-side estimate off the comp benchmarks the company buys plus the offers it has lost people to: no sheet, no HR system, no row anywhere else; a percentage, not money. It corroborates the raise LOOSELY, not exactly — 160,000 → 190,000 is +18.75 %, so the new ceiling closes most of a «twenty percent» gap and not all of it. That is rounding in a spoken estimate, not a planted contradiction: neither figure is derived from the other, Guryev marks the twenty as his own read on the line and says the raise does not fully close it. Distinct from retail_metrics_price_gap_pct above — same number, different subject (competitor list price, not compensation) and different speaker"
  guryev_drift_hypothetical:
    value: 750_000
    note: "spoken as «seven fifty» by Guryev in leadership-02, immediately after the 600,000 approval — a rhetorical counterfactual, NOT a fourth budget version: his illustration of what an estimate turns into once nobody records where it came from, and he says on the line that he is inventing the figure. Deliberate foreshadowing of arc 3 (600,000 → 825,000 → 1,050,000): he drifts in the right direction and lands low, two months before Akhmetov's real recount of «eight twenty-five» in sync-04. Never approved, never in a sheet, never repeated anywhere in the corpus — surfacing it as a budget version is an extraction error, which is why it is committed here rather than left unsourced"
  standard_discount_ceiling_pct:
    value: 10
    note: "the standing discount ceiling Reuter quotes to Northern House procurement in retro-01 — «up to ten percent», the standard answer off the rate card, given to anyone who asks before a negotiation starts. A policy limit, NOT a discount granted on any deal: no CRM row carries discount_pct 10, no Northern House number is agreed anywhere in the corpus, and D-009 stays at its full 410,000. Deliberately distinct from D-004.discount_pct (15 %), the Foodline exception signed above this ceiling that retro-01 exists to review, and from retail_metrics_price_gap_pct (20 %), a competitor benchmark; reading any of the three as the other is an extraction error. A percentage, not money, and never a booking"

