# ground-truth.yaml — the single source of truth for the demo company "Helion"
# (English localization of demo/gelion. The arcs, the acceptance questions and
#  the validator are the same; the IDS ARE NOT — they were re-slugged into
#  English, and the money was rebased to a US scale. See GLOSSARY.md.)
#
# Every load-bearing figure in the corpus, the CRM export and the finance sheet
# descends from this file; incidental figures that are merely spoken out loud
# are committed under `background_figures` below, so that nothing a reader can
# hear is left unsourced. Changing a number = change it here + regenerate +
# run the validator.
#
# MONEY SCALE: US dollars for a ~85-person US SaaS company. 2025 revenue
# 17,175,000; monthly revenue runs 1.1M-1.9M. Anything quoted out loud is
# spoken the way a US operator speaks it — "four point four", "eight
# twenty-five", "one-ninety" — never "four hundred and forty thousand".
#
# NOTE FOR TRANSLATORS: every `anchor` and `pattern` below is a REGULAR
# EXPRESSION, matched case-insensitively (re.I) by scripts/validate_corpus.py.
# `anchor` is searched only in the named speaker's lines of the named meeting.
# `pattern` (negative_controls, lonely_facts, client_boundary) is searched in
# the FULL text of transcripts. See GLOSSARY.md for the exact English wording
# each anchor expects and for the words that must never appear at all.

meta:
  name: Helion
  seed: 20260301
  period: {start: 2026-03-01, end: 2026-06-30}
  currency: USD
  slice: 4                      # current slice: 20 meetings out of 57
  slice_meetings: [leadership-02, sync-03, sales-04, delivery-02, leadership-06,
                    leadership-07, sync-04, sales-06, delivery-03, retro-01,
                    sync-05, client-northern-1, board-01, leadership-09,
                    client-titan-1, client-titan-2, client-titan-3,
                    client-titan-4, client-titan-5, client-titan-6]

company:
  # Книга клиентов. CRM-выгрузка в data/crm_deals.csv — НЕ вся книга: это срез
  # сделок, затронутых встречами корпуса (ноя-2025 — май-2026), 12 счетов.
  # Основная выручка — регулярная подписка установленной базы, которая не
  # заводится в CRM как сделка. Без этого поля 24 сделки на $3,88M не сходятся
  # с выручкой $17,175,000 в год.
  installed_base_accounts: 142
  installed_base_note: >-
    142 активных счёта на конец 2025; средний ARR ~$118K. crm_deals.csv
    покрывает только те 12, что упоминаются во встречах.
  legal: Helion Inc.
  what: "Pulse — a B2B customer-analytics platform; SaaS plus implementation"
  age_years: 7
  headcount: 85
  revenue_2025: 17_175_000
  departments:
    Engineering: 35
    "Delivery and Support": 15
    Sales: 8
    Product: 6
    Marketing: 5
    Finance: 3
    "People and Office": 4
    Leadership: 4
    Other: 5

