# Клиентские звонки не должны «знать» внутренние факты компании — прямая
# проверка того же разграничения доступа, которое продукт продаёт как
# фичу (гл. 14). Паттерны — уже провалидированные якоря из внутренних
# встреч, переиспользованы намеренно: если они «протекли» в клиентский
# звонок, это тот же факт, просто не там, где ему можно быть.
client_boundary:
  - id: CB-01
    meetings: [klient-titan-1, klient-titan-2, klient-titan-3, klient-titan-4,
               klient-titan-5, klient-titan-6, klient-severdom-1]
    forbidden:
      - {pattern: "менеджер.{0,15}продаж", from: LF-05, note: "решение о найме менеджеров по продажам — внутреннее. Паттерн намеренно узкий, см. примечание к LF-05"}
      - {pattern: "немногословная", from: GF-06D, note: "наблюдение о состоянии Соколовой — внутреннее"}
      - {pattern: "трёхстах пятидесяти", from: GF-10A, note: "сумма раунда — гриф board"}
      - {pattern: "трёхсот двадцати тысяч", from: GF-10B, note: "вилка тимлида — гриф board"}
      - {pattern: "итого двадцать один", from: GF-03C, note: "финальный бюджет v3 — внутренняя цифра"}

# Факты, которые ДОЛЖНЫ прозвучать РОВНО в одной названной встрече
# и не встретиться больше нигде в загруженном корпусе.
# Показывает «решение принято и забыто» не декларативно, а как факт корпуса.
lonely_facts:
  - {id: LF-05, arc: 5, meeting: ruk-07, pattern: "менеджер.{0,15}продаж",
     note: "решение о найме МЕНЕДЖЕРОВ ПО ПРОДАЖАМ — не должно всплыть ни в одной ДРУГОЙ встрече. Паттерн намеренно узкий: широкие формы глагола «нанимать» ловят и не связанные разговоры о найме (ruk-06, «Нанимать?» про внутренний ресурс внедрения — легитимная другая тема, не нарушение)"}

# Структурные ответы графового канала — не текстовые якоря, а факт отношения.
# Основание для каждого имени указано явно, чтобы не спорить, откуда оно взялось.
graph_answers:
  - id: GA-11
    arc: 11
    question: "Кто работал и с Титаном, и с Фудлайном?"
    answer:
      - {person: frolov,   basis: "прямая речь: отчитывается по Титану И по Фудлайну в одной встрече, prod-04 и prod-06"}
      - {person: vatulin,  basis: "делегирование Фудлайна (vnedr-02/03) + явное самозаявление о будущем Титане (vnedr-03, 02:37)"}
      - {person: akhmetov, basis: "продакт по Титану (sink-03/04) + явно связывает Фудлайн с миграцией графиков (sink-04, 02:49)"}
    note: "три человека, три разных основания — тест на то, что система не путает `присутствовал в комнате` с `работал с клиентом`"

# Строки, которых НЕ должно быть НИГДЕ во всём корпусе.
negative_controls:
  - {id: NC-12,  arc: 12, pattern: "churn|когорт",
     note: "арка №12: честное «не знаю». Тема не обсуждалась ни разу"}
  - {id: NC-13A, arc: 13, pattern: "Демидов",
     note: "арка №13: подписант со стороны Северного Дома нигде не назван → красное поле в КП"}
  - {id: NC-13B, arc: 13, pattern: "срок поставки",
     note: "арка №13: срок поставки нигде не зафиксирован → второе красное поле"}

# Пары, которые не должны встретиться в ОДНОМ транскрипте.
forbidden_cooccurrence:
  - {id: FC-01, arc: 1, a: "15 октября|пятнадцат\\w+ октября", b: "декабр",
     note: "две даты по одному модулю ни разу не звучат вместе — иначе рассинхрона нет"}

