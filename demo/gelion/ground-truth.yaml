# Приёмочные вопросы. Заморожены ДО генерации корпуса.
# testable_on_slice_1 — что можно проверить уже на пяти встречах.
acceptance_questions:
  - {id: Q01, arc: 1,  q: "Что мы обещали Титан-Банку по срокам модуля отчётности?",
     expect: "две даты — 15 октября (Реутова, prod-04) и декабрьский релиз (sink-03), обе с источниками",
     testable_on_slice_1: true, testable_on_slice_2: true, testable_on_slice_3: true}
  - {id: Q02, arc: 2,  q: "Какая у нас выручка за первый квартал?",
