name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install ruff
        run: uv tool install ruff==0.6.9
      - name: Ruff check
        # Гейт настроен в pyproject.toml: синтаксис и неопределённые имена.
        # Стилистическая зачистка идёт в монорепо, из которого собран срез.
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true  # включим в обязательные после форматирования всего репо

  contract-tests:
    name: Contract tests (offline, no keys)
    runs-on: ubuntu-latest
    needs: python-lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run offline contract tests
        # Каждый файл — отдельный процесс; пропуск по зависимостям виден в
        # отчёте и не считается успехом. См. scripts/run_offline_tests.py.
        run: python scripts/run_offline_tests.py

  migration-lint:
    name: SQL migration safety lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run migration linter (errors block merge)
        run: python backend/db/migration_lint.py

  config-smoke:
    name: Config validator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pydantic pydantic-settings structlog
      - name: Production secrets validator must reject defaults
        env:
          APP_ENV: production
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          err = None
          try:
              from backend.config import Settings
              Settings()
          except Exception as e:
              err = e

          if err is not None and "Insecure default secrets" in str(err):
              print("OK: production rejected insecure defaults")
              sys.exit(0)
          if err is not None:
              print("UNEXPECTED:", err)
              sys.exit(1)
          print("FAIL: production accepted insecure defaults")
          sys.exit(1)
          PY
