name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install ruff
        run: uv tool install ruff==0.6.9
      - name: Ruff check
        run: ruff check tessent_brain alfa_asynk_meetflow mark001_async
      - name: Ruff format check
        run: ruff format --check tessent_brain alfa_asynk_meetflow mark001_async
        continue-on-error: true  # включим в обязательные после форматирования всего репо

  python-tests:
    name: Python tests (tessent_brain)
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps for unit tests
        run: |
          python -m pip install --upgrade pip
          # pytest core + transitive deps, нужные для импорта backend.* модулей
          # без живых сервисов. Полный requirements.txt не ставим — слишком тяжёлый.
          pip install \
              pydantic pydantic-settings structlog \
              pytest pytest-asyncio pytest-cov \
              pyjwt cryptography \
              httpx tenacity \
              redis sqlalchemy
      - name: Run unit tests (no infra deps, with coverage)
        working-directory: tessent_brain
        run: |
          # tests/unit/ — pure-Python тесты W1-W4 модулей, без PG/Neo4j/Qdrant/Redis.
          # Coverage по новым observability/llm-quota/middleware модулям и config.
          python -m pytest tests/unit -q \
            --cov=backend.core.observability \
            --cov=backend.core.llm.quota \
            --cov=backend.core.llm.prompt_cache \
            --cov=backend.api.middleware.rate_limit \
            --cov=backend.api.middleware.tenant_resolver \
            --cov=backend.db.postgres_tenant \
            --cov=backend.config \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Run legacy integration tests (smoke, non-blocking)
        working-directory: tessent_brain
        run: |
          # Старые интеграционные тесты в tests/ требуют PG/Neo4j/Qdrant и
          # часто падают в чистом CI. Не блокируем, но прогоняем для видимости.
          python -m pytest tests -q --ignore=tests/unit \
            --ignore=tests/test_full_pipeline.py \
            --ignore=tests/test_supabase_real.py \
            --ignore=tests/test_graph_builder.py \
            --ignore=tests/test_vector_indexer.py \
            --ignore=tests/test_reasoning_engine.py \
            || echo "::warning::legacy integration tests reported failures (non-blocking)"

  migration-lint:
    name: SQL migration safety lint (W41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run migration linter (errors block merge)
        working-directory: tessent_brain
        run: python backend/db/migration_lint.py

  config-smoke:
    name: Config validator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pydantic pydantic-settings structlog
      - name: Production secrets validator must reject defaults
        working-directory: tessent_brain
        env:
          APP_ENV: production
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          # Импорт обёрнут в try: на module-level Settings() вызывается через
          # get_settings() (см. config.py) и валидатор бросает исключение
          # ДО того как Python вернёт нам класс Settings. Это и есть желаемое
          # поведение в проде, так что ловим оба варианта (на импорте и на
          # явном вызове).
          err = None
          try:
              from backend.config import Settings
              Settings()
          except Exception as e:
              err = e

          if err is not None and "Insecure default secrets" in str(err):
              print("OK: production rejected insecure defaults")
              sys.exit(0)
          if err is not None:
              print("UNEXPECTED:", err)
              sys.exit(1)
          print("FAIL: production accepted insecure defaults")
          sys.exit(1)
          PY

  node-lint:
    name: Node lint + typecheck (sima-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sima-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sima-app/package-lock.json
      - run: npm ci
      - name: Generate Prisma client (needed for tsc)
        run: npx prisma generate
      - name: TypeScript typecheck
        # Strict tsc — все 35 pre-existing ошибок зачищены отдельным PR
        # (target=es2017 → Map/Set iteration; @playwright/test в devDeps;
        # фиксы scope в StrategistPanel/SimaBlockNode/ai-cache/DiagramCanvas).
        run: npx tsc --noEmit
      - name: ESLint
        run: npx next lint --max-warnings 200
        continue-on-error: true
