version: '3.8'

# W36: light-weight stack для e2e интеграционных тестов.
# Не запускает API/worker — тесты сами поднимают модули из site-packages
# и работают напрямую с PG/Redis. Это:
#   - быстрее (cold start vs uvicorn)
#   - ловит проблемы на уровне SQL/migrations а не HTTP
#   - не требует сборки Dockerfile
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   POSTGRES_TEST_URL=postgresql+asyncpg://tessent:tessent_secret@localhost:54320/tessent_test \
#     REDIS_TEST_URL=redis://localhost:63790/0 \
#     pytest tests/integration/
#   docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: tessent_postgres_test
    environment:
      POSTGRES_DB: tessent_test
      POSTGRES_USER: tessent
      POSTGRES_PASSWORD: tessent_secret
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessent -d tessent_test"]
      interval: 3s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data:rw,size=512m   # ephemeral

  redis-test:
    image: redis:7-alpine
    container_name: tessent_redis_test
    command: redis-server --save "" --appendonly no
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

networks:
  default:
    name: tessent_test_network
